server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Hashed build artifacts: cache for a year, a new build gets new file names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Entry point: always revalidate so updates are picked up immediately.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri /index.html;
    }

    access_log off;
    error_log off;

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
